# Sinergi Connect — konfigurasi Netlify
# Perintah build di bawah menyusun folder secara otomatis, sehingga situs tetap
# berjalan baik bila berkas diunggah dalam folder (public/, netlify/) maupun
# semuanya di tingkat atas repositori.
[build]
  command = "mkdir -p public netlify/functions netlify/lib; for f in index.html admin.html ekosistem.json; do [ -f \"$f\" ] && cp -f \"$f\" public/; done; for f in admin.mjs berita.mjs berita-terjadwal.mjs gambar.mjs interaksi.mjs redaksi.mjs; do [ -f \"$f\" ] && cp -f \"$f\" netlify/functions/; done; [ -f inti.mjs ] && cp -f inti.mjs netlify/lib/; ls public netlify/functions netlify/lib"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/ekosistem.json"
  [headers.values]
    Cache-Control = "no-cache"
